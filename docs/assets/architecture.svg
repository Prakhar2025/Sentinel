  <path d="M 995 154 L 995 234" stroke="#31363f" stroke-width="1.6" marker-end="url(#a-arrow)"/>

  <line x1="30" y1="330" x2="1070" y2="330" stroke="#262a32"/>
  <g font-family="Consolas, monospace" font-size="11" fill="#565246">
