name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Format check
        run: python -m ruff format --check src tests scripts

      - name: Type check
        run: python -m mypy src

      - name: Tests with coverage
        run: python -m pytest -m "not slow and not bedrock"

  docker:
    name: container stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t sentinel-api .
      - name: Boot API and verify serving
        run: |
          docker run -d --name api -p 8000:8000 sentinel-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/healthz >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/healthz
          curl -sf -X POST http://localhost:8000/v1/events             -H "X-API-Key: dev-sentinel-key" -H "Content-Type: application/json"             -d '{"event_id":"ci-1","merchant_id":"m1","customer_id":"c1","amount_paise":100,"ts":"2026-08-20T10:00:00+05:30","payment_method":"upi"}'             | grep -o '"verdict":"[A-Z_]*"'
          docker rm -f api
      - name: Build console image
        run: docker build -t sentinel-console ./console

  postgres:
    name: postgres swap
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Postgres integration tests
        env:
          SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:PLACEHOLDER@localhost:5432/sentinel
        run: python -m pytest -m postgres --no-cov -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly: the wrapper action requires a
      # license on private repos, the binary does not.
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 \
            detect --source /repo --verbose --redact --exit-code 1
